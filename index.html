<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quiz – Le trésor du Soleil</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a1f2e 0%, #07141f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Montserrat', sans-serif;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: radial-gradient(circle at 30% 20%, #f3d382, #b47c2e);
            border-radius: 48px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        .quiz-container::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            height: 8px;
            background: linear-gradient(90deg, gold, #ffd966, gold);
            border-radius: 4px;
            opacity: 0.7;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 20px;
            color: #ffefb9;
            font-weight: bold;
            border: 1px solid #ffd966;
        }

        .score-box, .timer-box {
            background: #1e2a36;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.3rem;
            letter-spacing: 1px;
            box-shadow: inset 0 0 3px #000, 0 4px 8px rgba(0,0,0,0.3);
        }

        .score-box span, .timer-box span {
            color: #ffcd7e;
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .score-value, .timer-value {
            color: white;
            font-weight: 700;
            font-size: 1.6rem;
        }

        .question-area {
            background: rgba(10, 25, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 20px 30px;
            margin-bottom: 30px;
            border: 1px solid #ffd966;
            box-shadow: 0 15px 20px rgba(0,0,0,0.4);
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff4e0;
            text-shadow: 2px 2px 2px #00000055;
            text-align: center;
            line-height: 1.3;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .answer-btn {
            background: linear-gradient(145deg, #2c3e44, #1e2a32);
            border: 2px solid #dba53f;
            border-radius: 60px;
            padding: 16px 12px;
            font-size: 1.2rem;
            font-weight: 500;
            text-align: left;
            color: #f9eec1;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #5a3e1a;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .answer-letter {
            background: #dba53f;
            color: #1e2a32;
            font-weight: bold;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: inset 0 0 0 1px #ffeaac, 0 2px 4px black;
        }

        .answer-text {
            flex: 1;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            background: #3f5a64;
            border-color: #ffcd7e;
            box-shadow: 0 10px 0 #5a3e1a;
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #5a3e1a;
        }

        .answer-btn.disabled-true, .answer-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            background: #0a1a2aee;
            border-left: 10px solid #ffb347;
            padding: 16px 24px;
            border-radius: 40px;
            color: #f8f3e2;
            font-size: 1.1rem;
            margin-top: 15px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .result-screen {
            text-align: center;
            background: #0c1c2ae6;
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 40px;
            margin-top: 20px;
        }

        .final-score {
            font-size: 3rem;
            color: #ffd966;
            font-weight: bold;
        }

        .restart-btn, .terminer-btn {
            background: gold;
            border: none;
            padding: 12px 32px;
            font-size: 1.3rem;
            border-radius: 40px;
            margin: 20px 10px 0;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .terminer-btn {
            background: #ffaa33;
            color: #1e2a2f;
        }

        .hidden {
            display: none;
        }

        .trophy {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {
            .question-text { font-size: 1.2rem; }
            .answer-btn { font-size: 0.9rem; padding: 10px; }
            .answer-letter { width: 30px; height: 30px; font-size: 1rem; }
            .score-value, .timer-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizContainer">
    <div class="quiz-header">
        <div class="score-box">🏆 SCORE <span class="score-value" id="scoreValue">0</span></div>
        <div class="timer-box">⏱️ TEMPS <span class="timer-value" id="timerValue">30</span> s</div>
    </div>

    <div id="quizMain">
        <!-- dynamique -->
    </div>
</div>

<script>
    // ---------- DONNÉES DU QUIZ (9 questions, sans celle sur le rendement) ----------
    const questions = [
        { text: "Quel est le rôle principal d’un panneau photovoltaïque ?",
          options: ["A) Produire de l’eau chaude", "B) Transformer la lumière en électricité", "C) Chauffer l’air ambiant", "D) Stocker l’énergie thermique"],
          correct: 1,
          feedback: "Exact ! Un panneau photovoltaïque convertit le rayonnement solaire en électricité grâce à des cellules semi-conductrices." },
        { text: "Dans un chauffe‑eau solaire individuel, quel composant transforme le rayonnement solaire en chaleur ?",
          options: ["A) Le ballon de stockage", "B) Le circulateur", "C) Le capteur thermique", "D) L’échangeur électrique"],
          correct: 2,
          feedback: "Oui, le capteur thermique (ou panneau solaire thermique) capte les rayons du soleil et les transforme en chaleur transmise à un fluide caloporteur." },
        { text: "Le solaire thermique est principalement utilisé pour :",
          options: ["A) Produire de l’électricité", "B) Alimenter des ordinateurs", "C) Chauffer de l’eau ou des locaux", "D) Fabriquer des panneaux"],
          correct: 2,
          feedback: "Exact. Le solaire thermique sert à produire de la chaleur (eau chaude sanitaire, chauffage), contrairement au photovoltaïque." },
        { text: "Dans un chauffe‑eau solaire, le fluide caloporteur circule :",
          options: ["A) Dans un circuit électrique", "B) Du capteur vers le ballon et retour", "C) Uniquement dans le ballon", "D) Dans les panneaux photovoltaïques"],
          correct: 1,
          feedback: "Le fluide caloporteur capte la chaleur dans le capteur et la transporte vers l’échangeur du ballon, où elle réchauffe l’eau sanitaire." },
        { text: "Lequel de ces équipements utilise directement l’effet photoélectrique ?",
          options: ["A) Chauffe‑eau solaire", "B) Four solaire", "C) Panneau photovoltaïque", "D) Capteur à air"],
          correct: 2,
          feedback: "Le panneau photovoltaïque fonctionne grâce à l’effet photoélectrique qui libère des électrons sous l’action de la lumière." },
        { text: "Pourquoi dit‑on que l’énergie solaire est une énergie renouvelable ?",
          options: ["A) Parce qu’elle ne pollue pas du tout", "B) Parce qu’elle est illimitée à l’échelle humaine", "C) Parce qu’elle vient du soleil", "D) Parce qu’elle se recycle facilement"],
          correct: 1,
          feedback: "Le soleil produit de l’énergie depuis des milliards d’années et pour des milliards d’années encore ; à notre échelle, c’est une ressource inépuisable." },
        { text: "Quel est l’avantage principal d’un système solaire combiné (photovoltaïque + thermique) ?",
          options: ["A) Il réduit le coût total", "B) Il permet de produire à la fois électricité et chaleur", "C) Il fonctionne uniquement en été", "D) Il ne nécessite aucun entretien"],
          correct: 1,
          feedback: "Les systèmes hybrides (PV‑T) combinent les deux technologies pour fournir électricité et eau chaude sur un même espace, optimisant l’utilisation du toit." },
        { text: "Dans un chauffe‑eau solaire, l’appoint électrique sert à :",
          options: ["A) Remplacer le capteur en hiver", "B) Chauffer l’eau quand l’ensoleillement est insuffisant", "C) Augmenter le rendement du capteur", "D) Faire circuler le fluide"],
          correct: 1,
          feedback: "L’appoint (électrique ou gaz) prend le relais lorsque la température de l’eau dans le ballon n’atteint pas celle souhaitée, garantissant l’eau chaude toute l’année." },
        { text: "Selon le programme de technologie en 3e, quel est l’objectif principal de l’étude des énergies renouvelables ?",
          options: ["A) Mémoriser des chiffres de production", "B) Comprendre les chaînes énergétiques et les enjeux du développement durable", "C) Fabriquer des panneaux solaires", "D) Calculer le prix de l’électricité"],
          correct: 1,
          feedback: "Le programme vise à faire comprendre les transformations d’énergie, les avantages et limites de chaque source, et à sensibiliser aux choix énergétiques durables." }
    ];

    const POINTS_PAR_BONNE = 10;
    const TEMPS_PAR_QUESTION = 30;

    let currentIndex = 0;
    let totalScore = 0;
    let answered = false;
    let timerInterval = null;
    let timeLeft = TEMPS_PAR_QUESTION;
    let autoAdvanceTimeout = null;

    const quizMain = document.getElementById('quizMain');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function clearAutoAdvance() {
        if (autoAdvanceTimeout) {
            clearTimeout(autoAdvanceTimeout);
            autoAdvanceTimeout = null;
        }
    }

    function startTimer() {
        stopTimer();
        timeLeft = TEMPS_PAR_QUESTION;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!answered && timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft === 0) {
                    stopTimer();
                    if (!answered) {
                        // temps écoulé, on considère mauvaise réponse
                        disableAnswerButtons(true);
                        const correctAnswer = getCurrentCorrectAnswerText();
                        showFeedback(`Temps écoulé ! La bonne réponse était : ${correctAnswer}`, false);
                        answered = true;
                        // déclencher le passage automatique après délai
                        scheduleAutoAdvance();
                    }
                }
            } else if (answered) {
                stopTimer();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        timerSpan.innerText = timeLeft;
    }

    function getCurrentCorrectAnswerText() {
        const q = questions[currentIndex];
        const correctIdx = q.correct;
        return q.options[correctIdx];
    }

    function showFeedback(message, isCorrect) {
        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback';
        feedbackDiv.innerHTML = (isCorrect ? "✅ " : "❌ ") + message;
        const oldFeedback = document.querySelector('.feedback');
        if (oldFeedback) oldFeedback.remove();
        const answersGrid = document.querySelector('.answers-grid');
        answersGrid.insertAdjacentElement('afterend', feedbackDiv);
    }

    function disableAnswerButtons(disabled) {
        const btns = document.querySelectorAll('.answer-btn');
        btns.forEach(btn => {
            btn.disabled = disabled;
            if (disabled) btn.classList.add('disabled-true');
            else btn.classList.remove('disabled-true');
        });
    }

    function scheduleAutoAdvance() {
        clearAutoAdvance();
        autoAdvanceTimeout = setTimeout(() => {
            if (currentIndex + 1 < questions.length) {
                currentIndex++;
                renderCurrentQuestion();
            } else {
                showFinalResult();
            }
        }, 2000); // 2 secondes après feedback
    }

    function handleAnswer(selectedIdx) {
        if (answered) return;
        const currentQ = questions[currentIndex];
        const isCorrect = (selectedIdx === currentQ.correct);
        stopTimer();
        if (isCorrect) {
            totalScore += POINTS_PAR_BONNE;
            updateScoreDisplay();
            showFeedback(currentQ.feedback, true);
        } else {
            const correctLetter = String.fromCharCode(65 + currentQ.correct);
            const feedbackMsg = `Mauvaise réponse. La bonne réponse était ${correctLetter}) ${currentQ.options[currentQ.correct]}. ${currentQ.feedback}`;
            showFeedback(feedbackMsg, false);
        }
        answered = true;
        disableAnswerButtons(true);
        scheduleAutoAdvance();
    }

    function updateScoreDisplay() {
        scoreSpan.innerText = totalScore;
    }

    function showFinalResult() {
        stopTimer();
        clearAutoAdvance();
        const totalPossible = questions.length * POINTS_PAR_BONNE;
        const percent = Math.round((totalScore / totalPossible) * 100);
        quizMain.innerHTML = `
            <div class="result-screen">
                <div class="trophy">🏆</div>
                <div style="font-size:2rem;">FÉLICITATIONS !</div>
                <div class="final-score">${totalScore} / ${totalPossible}</div>
                <div style="font-size:1.3rem; margin-top:10px;">Taux de réussite : ${percent}%</div>
                <div style="margin-top:20px;">Merci d’avoir participé au Trésor du Soleil !</div>
                <div>
                    <button class="restart-btn" id="restartQuiz">✨ Rejouer ✨</button>
                    <button class="terminer-btn" id="terminerQuiz">🏁 Terminer</button>
                </div>
            </div>
        `;
        document.getElementById('restartQuiz').addEventListener('click', () => {
            currentIndex = 0;
            totalScore = 0;
            answered = false;
            updateScoreDisplay();
            renderCurrentQuestion();
        });
        document.getElementById('terminerQuiz').addEventListener('click', () => {
            // Ici, tu peux définir ce qui doit se passer (par exemple afficher un message, fermer le quiz, etc.)
            alert("Bravo ! Le quiz est terminé. N’hésite pas à le refaire pour améliorer ton score !");
            // Optionnel : rediriger vers une autre page ou cacher le quiz
        });
    }

    function renderCurrentQuestion() {
        // reset state
        answered = false;
        stopTimer();
        clearAutoAdvance();
        const q = questions[currentIndex];
        let html = `
            <div class="question-area">
                <div class="question-text">${q.text}</div>
            </div>
            <div class="answers-grid">
        `;
        q.options.forEach((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            html += `
                <button class="answer-btn" data-idx="${idx}">
                    <span class="answer-letter">${letter}</span>
                    <span class="answer-text">${opt}</span>
                </button>
            `;
        });
        html += `</div>`;
        quizMain.innerHTML = html;

        const btns = document.querySelectorAll('.answer-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                if (!answered) handleAnswer(idx);
            });
        });

        startTimer();
        // supprimer un éventuel ancien feedback
        const oldFeedback = document.querySelector('.feedback');
        if (oldFeedback) oldFeedback.remove();
    }

    // initialisation
    renderCurrentQuestion();
    updateScoreDisplay();
</script>
</body>
</html>
